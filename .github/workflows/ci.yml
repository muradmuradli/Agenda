name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 12
  NODE_VERSION: 24

jobs:
  test:
    name: Lint, typecheck, build & unit test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm exec vitest run --passWithNoTests

  e2e:
    name: E2E / integration tests
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agenda_test
      REDIS_URL: redis://localhost:6379
      KAFKA_BROKERS: localhost:9094
      JWT_PRIVATE_KEY_PATH: ./keys/private.pem
      JWT_ISSUER: http://localhost:3001
      JWT_AUDIENCE: ticket-platform
      ACCESS_TOKEN_TTL_SECONDS: 900

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Generate throwaway JWT signing key
        run: |
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048

      - name: Run migrations
        run: pnpm exec prisma migrate deploy

      - name: E2E tests
        run: pnpm exec vitest run --config ./vitest.config.e2e.ts --passWithNoTests
